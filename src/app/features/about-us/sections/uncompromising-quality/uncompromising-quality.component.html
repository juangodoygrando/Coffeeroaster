<section
  class="flex flex-col items-center bg-coffee-dark-blue rounded-lg mt-24 pt-10 px-6 pb-16 gap-20 text-center md:gap-16 lg:text-left lg:gap-16 lg:px-9     lg:flex-row-reverse"
>
  <picture
    class="w-full h-auto lg:max-w-[445px] lg:shrink-0 -mt-24"
  >
    <source media="(min-width: 1024px)" [srcset]="quality.image.desktop" />
    <source media="(min-width: 768px)" [srcset]="quality.image.tablet" />
    <img
      [src]="quality.image.mobile"
      [alt]="quality.image.alt"
      class="w-full h-auto rounded-lg object-cover"
    />
  </picture>

  <div class="flex flex-col lg:items-start gap-8 md:gap-6 lg:gap-8">
    <h2
      class="font-fraunces font-black text-coffee-cream text-[2rem] leading-9 lg:text-[2.5rem] lg:leading-[3rem]"
    >
      {{ quality.title }}
    </h2>
    <p
      class="font-barlow text-coffee-cream/80 text-[0.9375rem] leading-[1.5625rem] lg:text-base lg:leading-[1.625rem]"
    >
      {{ quality.description }}
    </p>
  </div>
</section>

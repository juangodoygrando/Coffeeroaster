<header
  class="relative flex justify-between items-center py-2 z-50 sm:mt-3 md:mt-4"
>
  <div class="flex justify-between items-center w-full mt-2 mb-4">
    <img
      src="/assets/shared/desktop/logo.svg"
      alt="logo coffeeroasters"
      class="h-6 md:h-10"
    />

    <button (click)="toggleMenu()" class="md:hidden border-none w-4 h-4">
      <img
        [src]="
          menuOpen()
            ? '/assets/shared/mobile/icon-close.svg'
            : '/assets/shared/mobile/icon-hamburger.svg'
        "
        [alt]="menuOpen() ? 'Close menu' : 'Open menu'"
      />
    </button>

    <nav
      class="hidden md:flex gap-6 whitespace-nowrap text-gray-500 font-semibold text-[10px] md:text-base"
    >
      @for (link of navLinks; track link.path) {
        <a [routerLink]="link.path" class="uppercase">{{ link.label }}</a>
      }
    </nav>
  </div>
</header>

@if (menuOpen()) {
  <nav
    class="fixed inset-0 z-40 pt-24 bg-coffee-cream/90 flex flex-col text-center gap-8 font-black text-2xl text-coffee-dark-blue"
  >
    @for (link of navLinks; track link.path) {
      <a [routerLink]="link.path" (click)="menuOpen.set(false)">{{
        link.label
      }}</a>
    }
  </nav>
}
